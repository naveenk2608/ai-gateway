# Local stack. `docker compose up` starts Postgres and Redis for development and integration
# tests; `docker compose --profile full up --build` adds the gateway, worker and dashboard.
# `--profile observability` adds Prometheus and Grafana, scraping the gateway and worker (ADR 017):
# `docker compose --profile full --profile observability up -d --build`.
#
# Local development only: Postgres uses trust auth and every port is bound to 127.0.0.1, so no
# password exists anywhere in the repo. Real deployments pass credentials through DATABASE_URL
# (Secrets Manager in M10).

name: ai-gateway

services:
  postgres:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_USER: gateway
      POSTGRES_DB: gateway
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U gateway -d gateway]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.11-alpine3.21
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    profiles: [full]
    build:
      context: ../..
      dockerfile: Dockerfile
      target: gateway
    environment:
      DATABASE_URL: postgres://gateway@postgres:5432/gateway
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      # Ollama running on the host machine.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Optional: enables the hosted example deployment in config/models.json.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Required: set it in .env (`openssl rand -hex 32`); the gateway exits without it.
      API_KEY_PEPPER: ${API_KEY_PEPPER:-}
      # Plain HTTP on localhost, so the session cookie cannot be HTTPS-only.
      SESSION_COOKIE_SECURE: 'false'
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_API_KEY: ${BOOTSTRAP_API_KEY:-}
      # Private metrics listener for Prometheus, reachable on the Compose network only (the port
      # is not published), so it needs no token. /metrics on 8080 stays off without METRICS_TOKEN.
      METRICS_PORT: 9464
      METRICS_HOST: 0.0.0.0
    extra_hosts:
      # Makes host.docker.internal resolve on Linux too (Docker Desktop provides it already).
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${GATEWAY_PORT:-8080}:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Longer than SHUTDOWN_TIMEOUT_MS so the drain finishes before Docker sends SIGKILL.
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/health]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    profiles: [full]
    build:
      context: ../..
      dockerfile: Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgres://gateway@postgres:5432/gateway
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      # Metrics on WORKER_METRICS_PORT (9465), for Prometheus on the Compose network only.
      METRICS_HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 15s

  dashboard:
    profiles: [full]
    build:
      context: ../..
      dockerfile: Dockerfile
      target: dashboard
    ports:
      - 127.0.0.1:${DASHBOARD_PORT:-3000}:80
    depends_on:
      gateway:
        condition: service_healthy

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # A day of history, capped in size: enough to watch a demo or a test run.
      - --storage.tsdb.retention.time=1d
      - --storage.tsdb.retention.size=256MB
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    mem_limit: 256m

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.3
    environment:
      # Local and read-only: anonymous viewers, no login form, no admin password anywhere. The
      # datasource and dashboard are provisioned from files.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ai-gateway.json
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3001}:3000
    depends_on:
      - prometheus
    mem_limit: 256m

volumes:
  postgres-data:
