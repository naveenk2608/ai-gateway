# Local stack. `docker compose up` starts Postgres and Redis for development and integration
# tests; `docker compose --profile full up --build` adds the gateway (serving the
# dashboard at /dashboard/) and the worker.
# `--profile observability` adds Prometheus and Grafana, scraping the gateway and worker (ADR 017):
# `docker compose --profile full --profile observability up -d --build`.
#
# Local development only: Postgres uses trust auth and every port is bound to 127.0.0.1, so no
# password exists anywhere in the repo. Real deployments pass credentials through DATABASE_URL
# (Secrets Manager in M10).

name: ai-gateway

services:
  postgres:
    # pgvector's image (Postgres 16 with pgvector 0.8.6, PostgreSQL License) for the semantic cache
    # (ADR 040). It is Debian-based: text sorts differently from the Alpine image used before M18,
    # so its data lives in a new volume; the old `postgres-data` volume is left untouched.
    image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: gateway
      POSTGRES_DB: gateway
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres-vector-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U gateway -d gateway]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.11-alpine3.21
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    profiles: [full]
    build:
      context: ../..
      dockerfile: Dockerfile
      target: gateway
    environment:
      DATABASE_URL: postgres://gateway@postgres:5432/gateway
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      # Ollama running on the host machine.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      # Optional: enable the hosted deployments in config/models.json.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      ZAI_API_KEY: ${ZAI_API_KEY:-}
      # Browser origins allowed to call /v1, e.g. the playground's (ADR 021).
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Required: set it in .env (`openssl rand -hex 32`); the gateway exits without it.
      API_KEY_PEPPER: ${API_KEY_PEPPER:-}
      # Tracing (ADR 037): http://jaeger:4318 with `--profile tracing`; unset, it stays off.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # Plain HTTP on localhost, so the session cookie cannot be HTTPS-only.
      SESSION_COOKIE_SECURE: 'false'
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_API_KEY: ${BOOTSTRAP_API_KEY:-}
      # Private metrics listener for Prometheus, reachable on the Compose network only (the port
      # is not published), so it needs no token. /metrics on 8080 stays off without METRICS_TOKEN.
      METRICS_PORT: 9464
      METRICS_HOST: 0.0.0.0
    extra_hosts:
      # Makes host.docker.internal resolve on Linux too (Docker Desktop provides it already).
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${GATEWAY_PORT:-8080}:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Longer than SHUTDOWN_TIMEOUT_MS so the drain finishes before Docker sends SIGKILL.
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/health]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    profiles: [full]
    build:
      context: ../..
      dockerfile: Dockerfile
      target: worker
    environment:
      DATABASE_URL: postgres://gateway@postgres:5432/gateway
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      # Metrics on WORKER_METRICS_PORT (9465), for Prometheus on the Compose network only.
      METRICS_HOST: 0.0.0.0
      # Webhook alerts (ADR 033): the key that opens destination URLs, derived from the pepper
      # unless ALERTS_ENCRYPTION_KEY is set; without either, alerts are queued but not sent.
      API_KEY_PEPPER: ${API_KEY_PEPPER:-}
      ALERTS_ENCRYPTION_KEY: ${ALERTS_ENCRYPTION_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 15s

  # A local SQS for the SQS event bus (ADR 023): `docker compose --profile aws-local up -d`.
  # SQS only, no persistence, nothing leaves the machine. Pinned to 4.14.0, the last LocalStack
  # release that runs without an account token; later images require one.
  localstack:
    profiles: [aws-local]
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    environment:
      SERVICES: sqs
      # Queue URLs as http://localhost:4566/queue/<region>/<account>/<name>.
      SQS_ENDPOINT_STRATEGY: path
      # No usage analytics sent to LocalStack, no certificate download at start-up.
      DISABLE_EVENTS: '1'
      SKIP_SSL_CERT_DOWNLOAD: '1'
    ports:
      - 127.0.0.1:${LOCALSTACK_PORT:-4566}:4566
    healthcheck:
      test: [CMD, curl, -fs, http://127.0.0.1:4566/_localstack/health]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Three days of history, capped in size: the longest SLO alert window (docs/slo.md).
      - --storage.tsdb.retention.time=3d
      - --storage.tsdb.retention.size=256MB
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    mem_limit: 256m

  grafana:
    profiles: [observability]
    image: grafana/grafana:13.2.3
    environment:
      # Local and read-only: anonymous viewers, no login form, no admin password anywhere. The
      # datasource and dashboard are provisioned from files.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ai-gateway.json
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3001}:3000
    depends_on:
      - prometheus
    mem_limit: 256m

  # Traces (M17, ADR 037): Jaeger's all-in-one, in memory. Start it with `--profile tracing` and
  # set OTEL_EXPORTER_OTLP_ENDPOINT (http://jaeger:4318 for the Compose gateway and worker,
  # http://127.0.0.1:4318 for `pnpm dev`); the UI is on http://127.0.0.1:16686.
  jaeger:
    profiles: [tracing]
    image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
    ports:
      - 127.0.0.1:${JAEGER_UI_PORT:-16686}:16686
      - 127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318
    mem_limit: 512m

volumes:
  postgres-vector-data:
