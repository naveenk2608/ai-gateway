# Scrapes the gateway's and the worker's private metrics listeners on the Compose network
# (`docker compose --profile full --profile observability up`). Neither port is published to the
# host, so no METRICS_TOKEN is needed here. ADR 017.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ['gateway:9464']
  - job_name: worker
    static_configs:
      - targets: ['worker:9465']
