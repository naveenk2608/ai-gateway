apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ai-gateway.name" . }}-models
  labels:
    {{- include "ai-gateway.labels" . | nindent 4 }}
data:
  # Holds no secrets: API keys are named by variable (apiKeyEnv) and come from the Secret.
  models.json: |
    {{- toPrettyJson .Values.models | nindent 4 }}
