name: Bench

# Runs the benchmarks (`pnpm bench`, ADR 019) on a GitHub-hosted runner, only when started by hand
# (Actions > Bench > Run workflow, or `gh workflow run bench.yml`), and uploads bench/results as an
# artifact. Hosted runners are free for public repositories. Nothing is committed or published: to
# update docs/benchmarks.md, download the artifact, copy its new run directory into bench/results/
# and run `pnpm bench:report` (the report reads the newest run). Like CI, it uses only GitHub's own
# actions, pinned by commit SHA, and a read-only token (ADR 027).
on:
  workflow_dispatch:
    inputs:
      only:
        description: >-
          BENCH_ONLY: scenario name prefixes, comma-separated (e.g. spread,coalesce). Empty runs
          every scenario; the report needs a run with every scenario.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  bench:
    name: pnpm bench
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Run the benchmarks (builds the images, starts the bench stack, removes it at the end)
        env:
          # Passed through the environment, never into the script text.
          BENCH_ONLY: ${{ inputs.only }}
        run: pnpm bench
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-results
          path: bench/results/
          if-no-files-found: error
          retention-days: 30
