name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      # No hard-coded numbers in dashboard chart data (M7).
      - run: pnpm check:dashboard-data
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    name: Integration tests (Postgres + Redis)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: gateway
          POSTGRES_DB: gateway
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gateway -d gateway"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4.11-alpine3.21
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://gateway@localhost:5432/gateway
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int

  dashboard-e2e:
    name: Dashboard in a browser (375 px)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ai-gateway/dashboard exec playwright install --with-deps chromium
      - run: pnpm --filter @ai-gateway/dashboard test:e2e

  images:
    name: Container images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --profile full --profile observability config --quiet
      # The observability profile's Prometheus config (ADR 017), checked by Prometheus itself.
      - run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/infra/compose/observability:/etc/prometheus:ro"
          prom/prometheus:v3.15.0 check config /etc/prometheus/prometheus.yml
      - run: docker compose --profile full build
