server {
  listen 80;
  root /usr/share/nginx/html;

  # Proxy the gateway under /api so the dashboard and its API share one origin.
  location /api/ {
    # Docker's embedded DNS; resolving per request survives gateway restarts.
    resolver 127.0.0.11 valid=10s;
    set $gateway http://gateway:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $gateway;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
